name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR: acrtodoappsiddharth1.azurecr.io
  IMAGE: axion-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name acrtodoappsiddharth1

      - name: Build & Push
        run: |
          docker build -t $ACR/$IMAGE:latest .
          docker push $ACR/$IMAGE:latest
